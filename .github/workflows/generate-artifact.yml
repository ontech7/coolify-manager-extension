name: Generate Artifact

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create extension package
        run: |
          # Create a temporary directory for the extension files
          mkdir -p extension-build

          # Copy all files except the ones we want to exclude
          rsync -av --progress . extension-build/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='*.md' \
            --exclude='assets/screenshot*.png' \
            --exclude='assets/small-promo-title.png' \
            --exclude='extension-build'

          # Create the zip file
          cd extension-build
          zip -r ../coolify-manager-extension.zip .
          cd ..

          # Show what was included
          echo "Files included in the extension:"
          unzip -l coolify-manager-extension.zip

      - name: Get latest release
        id: get_release
        run: |
          LATEST_RELEASE=$(gh release list --limit 1 --json tagName --jq '.[0]')
          RELEASE_TAG=$(echo $LATEST_RELEASE | jq -r '.tagName')
          echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "Latest release tag: $RELEASE_TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact to latest release
        run: |
          gh release upload ${{ steps.get_release.outputs.tag }} coolify-manager-extension.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (for GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: coolify-manager-extension
          path: coolify-manager-extension.zip
